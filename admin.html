<!doctype html>
<html lang="pt-AO">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin — Nzinga Creatives</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-wrap{max-width:1100px;margin:0 auto;padding:32px 18px 100px}.admin-head{display:flex;justify-content:space-between;gap:16px;align-items:end;flex-wrap:wrap}.admin-head h1{font-size:clamp(2rem,6vw,4rem);margin:.1em 0}.admin-tabs{display:flex;gap:8px;overflow:auto;margin:24px 0}.admin-tabs button,.admin-actions button{border:1px solid currentColor;background:transparent;padding:10px 14px;border-radius:10px;cursor:pointer}.admin-tabs button.active{background:#fff;color:#000}.admin-panel{display:grid;gap:14px}.admin-card{border:1px solid rgba(127,127,127,.35);border-radius:16px;padding:18px;background:rgba(127,127,127,.06)}.admin-card h2{margin:.1em 0 .4em}.admin-meta{opacity:.7;font-size:.9rem}.admin-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.admin-actions .approve{background:#fff;color:#000}.admin-actions .danger{border-color:#d33}.admin-form{display:grid;gap:10px;margin-top:14px}.admin-form input,.admin-form textarea,.admin-form select{padding:12px;border:1px solid #777;background:transparent;color:inherit;border-radius:9px}.status{min-height:1.4em}.locked{padding:28px;border:1px solid #c33;border-radius:16px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat{padding:16px;border:1px solid rgba(127,127,127,.35);border-radius:14px}.stat strong{display:block;font-size:1.8rem}
  </style>
</head>
<body>
  <main class="admin-wrap">
    <section id="loading">A verificar acesso administrativo…</section>
    <section id="locked" class="locked" hidden><h1>Acesso restrito</h1><p>A tua conta não possui permissões de administrador.</p><a class="button" href="minha-nzinga.html">Voltar para Minha Nzinga</a></section>
    <section id="app" hidden>
      <header class="admin-head"><div><span class="admin-meta">NZINGA CREATIVES / ADMIN</span><h1>Painel de controlo</h1><p>Moderação, pedidos e avaliações num único lugar.</p></div><button id="logout" class="button">Sair</button></header>
      <div id="stats" class="stats"></div>
      <nav class="admin-tabs" aria-label="Secções administrativas"><button data-tab="products" class="active">Market</button><button data-tab="orders">Pedidos</button><button data-tab="reviews">Avaliações</button><button data-tab="users">Utilizadores</button></nav>
      <section id="panel-products" class="admin-panel"></section><section id="panel-orders" class="admin-panel" hidden></section><section id="panel-reviews" class="admin-panel" hidden></section><section id="panel-users" class="admin-panel" hidden></section>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
  <script>
  (()=>{
    const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
    const sb=window.supabase.createClient(window.NZINGA_SUPABASE.url,window.NZINGA_SUPABASE.publishableKey); let user;
    const money=(v,c='AOA')=>`${Number(v||0).toLocaleString('pt-AO',{minimumFractionDigits:2,maximumFractionDigits:2})} ${c}`;
    async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){location.href='minha-nzinga.html';return}user=session.user;const {data:admin,error}=await sb.from('admin_users').select('role').eq('user_id',user.id).maybeSingle();if(error||!admin){$('loading').hidden=true;$('locked').hidden=false;return}$('loading').hidden=true;$('app').hidden=false;await refreshAll()}
    async function refreshAll(){await Promise.all([loadProducts(),loadOrders(),loadReviews(),loadUsers()]);$('stats').innerHTML=`<div class="stat"><span>Produtos</span><strong id="sp">—</strong></div><div class="stat"><span>Pedidos</span><strong id="so">—</strong></div><div class="stat"><span>Avaliações</span><strong id="sr">—</strong></div>`; $('sp').textContent=$('panel-products').dataset.count||0;$('so').textContent=$('panel-orders').dataset.count||0;$('sr').textContent=$('panel-reviews').dataset.count||0}
    async function loadProducts(){const {data,error}=await sb.from('market_products').select('*').order('created_at',{ascending:false});const p=$('panel-products');if(error){p.innerHTML='<div class="admin-card">Não foi possível carregar o Market.</div>';return}p.dataset.count=data.length;p.innerHTML=data.length?data.map(x=>`<article class="admin-card"><span class="admin-meta">${esc(x.category)} · ${esc(x.status)}</span><h2>${esc(x.title)}</h2><p>${esc(x.description||'Sem descrição')}</p><p><strong>${money(x.price,x.currency)}</strong></p>${x.rejection_reason?`<p class="admin-meta">Motivo: ${esc(x.rejection_reason)}</p>`:''}<div class="admin-actions"><button class="approve" data-publish="${x.id}">Aprovar / Publicar</button><button data-archive="${x.id}">Arquivar</button><button data-edit="${x.id}">Editar</button></div><form class="admin-form" data-form="${x.id}" hidden><input name="title" value="${esc(x.title)}" maxlength="120" required><textarea name="description" maxlength="1000">${esc(x.description||'')}</textarea><input name="price" type="number" min="0" step="0.01" value="${Number(x.price||0)}"><button type="submit">Guardar alterações</button><p class="status"></p></form></article>`).join(''):'<div class="admin-card">Nenhum produto submetido.</div>';bindProductActions()}
    function bindProductActions(){document.querySelectorAll('[data-publish]').forEach(b=>b.onclick=async()=>{await updateProduct(b.dataset.publish,{status:'published',rejection_reason:null,reviewed_at:new Date().toISOString(),reviewed_by:user.id})});document.querySelectorAll('[data-archive]').forEach(b=>b.onclick=async()=>{const reason=prompt('Motivo da rejeição/arquivamento (opcional):')??'';await updateProduct(b.dataset.archive,{status:'archived',rejection_reason:reason,reviewed_at:new Date().toISOString(),reviewed_by:user.id})});document.querySelectorAll('[data-edit]').forEach(b=>{b.onclick=()=>{const f=document.querySelector(`[data-form="${b.dataset.edit}"]`);f.hidden=!f.hidden}});document.querySelectorAll('[data-form]').forEach(f=>f.onsubmit=async e=>{e.preventDefault();const fd=new FormData(f);await updateProduct(f.dataset.form,{title:String(fd.get('title')).trim(),description:String(fd.get('description')).trim(),price:Number(fd.get('price'))},f.querySelector('.status'))})}
    async function updateProduct(id,patch,statusEl){const {error}=await sb.from('market_products').update(patch).eq('id',id);if(statusEl)statusEl.textContent=error?'Erro ao guardar.':'Guardado.';if(!error)await refreshAll()}
    async function loadOrders(){const {data,error}=await sb.from('orders').select('*').order('created_at',{ascending:false});const p=$('panel-orders');if(error){p.innerHTML='<div class="admin-card">Não foi possível carregar os pedidos.</div>';return}p.dataset.count=data.length;p.innerHTML=data.length?data.map(x=>`<article class="admin-card"><span class="admin-meta">${esc(new Date(x.created_at).toLocaleString('pt-AO'))}</span><h2>${esc(x.service)} — ${esc(x.tier)}</h2><p><strong>${esc(x.name)}</strong> · ${esc(x.contact)}</p><p>${esc(x.idea||'Sem detalhes')}</p><form class="admin-actions" data-order="${x.id}"><select name="status"><option ${x.status==='Pedido iniciado'?'selected':''}>Pedido iniciado</option><option ${x.status==='Aguardando pagamento'?'selected':''}>Aguardando pagamento</option><option ${x.status==='Em produção'?'selected':''}>Em produção</option><option ${x.status==='Concluído'?'selected':''}>Concluído</option><option ${x.status==='Cancelado'?'selected':''}>Cancelado</option></select><button type="submit">Atualizar status</button></form></article>`).join(''):'<div class="admin-card">Nenhum pedido.</div>';document.querySelectorAll('[data-order]').forEach(f=>f.onsubmit=async e=>{e.preventDefault();const fd=new FormData(f);await sb.from('orders').update({status:fd.get('status')}).eq('id',f.dataset.order);await refreshAll()})}
    async function loadReviews(){const {data,error}=await sb.from('reviews').select('*').order('created_at',{ascending:false});const p=$('panel-reviews');if(error){p.innerHTML='<div class="admin-card">Não foi possível carregar as avaliações.</div>';return}p.dataset.count=data.length;p.innerHTML=data.length?data.map(x=>`<article class="admin-card"><span class="admin-meta">${esc(x.stars)} / 5 · ${esc(x.status)}</span><p>${esc(x.text)}</p><div class="admin-actions"><button data-review="${x.id}" data-value="${x.status==='published'?'hidden':'published'}">${x.status==='published'?'Ocultar':'Publicar'}</button></div></article>`).join(''):'<div class="admin-card">Nenhuma avaliação.</div>';document.querySelectorAll('[data-review]').forEach(b=>b.onclick=async()=>{await sb.from('reviews').update({status:b.dataset.value,moderated_at:new Date().toISOString(),moderated_by:user.id}).eq('id',b.dataset.review);await refreshAll()})}
    async function loadUsers(){const {data,error}=await sb.from('profiles').select('id,name,contact,created_at').order('created_at',{ascending:false});const p=$('panel-users');if(error){p.innerHTML='<div class="admin-card">Não foi possível carregar utilizadores.</div>';return}p.innerHTML=data.length?data.map(x=>`<article class="admin-card"><h2>${esc(x.name||'Sem nome')}</h2><p>${esc(x.contact||'Sem contacto')}</p><span class="admin-meta">Conta criada em ${esc(new Date(x.created_at).toLocaleDateString('pt-AO'))}</span></article>`).join(''):'<div class="admin-card">Nenhum perfil.</div>'}
    document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('[id^="panel-"]').forEach(x=>x.hidden=true);$('panel-'+b.dataset.tab).hidden=false});
    $('logout').onclick=async()=>{await sb.auth.signOut();location.href='minha-nzinga.html'};boot();
  })();
  </script>
</body></html>
