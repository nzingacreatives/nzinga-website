<!doctype html>
<html lang="pt-AO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>Admin — Nzinga Creatives</title>
  <link rel="stylesheet" href="style.css">
  <style>
    :root{--admin-red:#d71920;--admin-red-dark:#a90f15;--admin-yellow:#f2c400;--admin-yellow-soft:#fff4bd;--admin-black:#111;--admin-ink:#181818;--admin-paper:#fff;--admin-bg:#f3f0ea;--admin-line:#ded9d0;--admin-soft:#f8f6f2}
    *{box-sizing:border-box}body{margin:0;background:var(--admin-bg);color:var(--admin-ink);font-family:inherit}.admin-wrap{max-width:1360px;margin:auto;padding:24px 18px 72px}.admin-shell{display:grid;grid-template-columns:245px minmax(0,1fr);gap:22px;min-height:calc(100vh - 48px)}
    .admin-side{position:sticky;top:18px;height:calc(100vh - 36px);display:flex;flex-direction:column;border:1px solid var(--admin-line);border-radius:24px;background:var(--admin-paper);padding:16px;box-shadow:0 14px 38px rgba(0,0,0,.06)}.brand-mini{display:flex;align-items:center;gap:11px;padding:8px 6px 20px;border-bottom:2px solid var(--admin-yellow)}.brand-mark{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:var(--admin-black);color:#fff;font-weight:900}.brand-mini strong{font-size:.95rem}.brand-mini span{display:block;opacity:.52;font-size:.72rem;margin-top:2px}
    .side-nav{display:grid;gap:7px;padding-top:18px}.side-nav button{width:100%;border:1px solid transparent;background:transparent;color:var(--admin-ink);padding:12px 13px;border-radius:13px;cursor:pointer;font:inherit;display:flex;align-items:center;gap:11px;font-weight:700;transition:.18s}.side-nav button:hover{background:#f7f3e8;border-color:#eee0a4}.side-nav button.active{background:var(--admin-black);color:#fff;font-weight:900;box-shadow:4px 4px 0 var(--admin-red)}.side-footer{margin-top:auto;border-top:1px solid var(--admin-line);padding-top:14px}.logout{width:100%;border:1px solid var(--admin-line);background:#fff;color:var(--admin-ink);padding:11px;border-radius:11px;cursor:pointer;font-weight:800}.logout:hover{border-color:var(--admin-red);color:var(--admin-red)}
    .admin-main{min-width:0}.admin-top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.eyebrow{font-size:.72rem;letter-spacing:.15em;color:var(--admin-red);font-weight:900}.admin-top h1{font-size:clamp(2rem,5vw,3.35rem);line-height:.98;margin:.3em 0;color:var(--admin-red)}.admin-top p{opacity:.62;margin:0}.user-chip{display:flex;align-items:center;gap:9px;border:1px solid var(--admin-line);border-radius:999px;padding:8px 12px;font-size:.82rem;white-space:nowrap;background:#fff}.dot{width:8px;height:8px;border-radius:50%;background:#2f9e44}
    .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.stat{border:1px solid var(--admin-line);border-radius:18px;padding:17px;background:#fff;position:relative;overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,.045)}.stat:nth-child(1),.stat:nth-child(3){border-top:4px solid var(--admin-yellow)}.stat:nth-child(2),.stat:nth-child(4){border-top:4px solid var(--admin-red)}.stat span{font-size:.76rem;opacity:.58;font-weight:800}.stat strong{display:block;font-size:1.95rem;margin-top:7px}.stat small{opacity:.48}.stat-icon{float:right;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#fff4bd;color:#9b7b00;font-weight:900}.stat:nth-child(2) .stat-icon,.stat:nth-child(4) .stat-icon{background:#ffe1e3;color:var(--admin-red)}
    .admin-content{border:1px solid var(--admin-line);border-radius:22px;background:#fff;overflow:hidden;box-shadow:0 12px 34px rgba(0,0,0,.055)}.admin-panel{display:grid;gap:0}.panel-head{padding:18px 20px;border-bottom:2px solid var(--admin-red);display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff}.panel-head h2{margin:0;font-size:1.08rem;color:var(--admin-red)}.panel-head span{font-size:.78rem;opacity:.5}.admin-card{padding:18px 20px;border-bottom:1px solid #eee8df;background:#fff;transition:background .18s}.admin-card:hover{background:#fffdf8}.admin-card:last-child{border-bottom:0}.admin-card h2{margin:5px 0 7px;font-size:1.08rem}.admin-meta{font-size:.72rem;opacity:.58;text-transform:uppercase;letter-spacing:.05em}.admin-card p{line-height:1.5;margin:7px 0;color:#3b3b3b}.admin-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.admin-actions button,.admin-actions select{border:1px solid #c9c4bb;background:#fff;color:var(--admin-ink);padding:9px 12px;border-radius:10px;cursor:pointer;font-weight:750}.admin-actions .approve{background:var(--admin-yellow);color:#151515;border-color:#d6a900;font-weight:900}.admin-actions .danger,.nz-admin-delete{background:var(--admin-red)!important;color:#fff!important;border-color:var(--admin-red)!important}.admin-form{display:grid;gap:9px;margin-top:13px;padding:14px;border-radius:14px;background:var(--admin-soft)}.admin-form input,.admin-form textarea,.admin-form select{padding:11px;border:1px solid #c9c4bb;background:#fff;color:#111;border-radius:9px;font:inherit}.admin-form textarea{min-height:90px;resize:vertical}.status{min-height:1.3em;margin:0!important;font-size:.82rem;color:var(--admin-red)}.empty{padding:42px 20px;text-align:center;opacity:.52}.empty strong{display:block;opacity:1;margin-bottom:5px;color:var(--admin-ink)}.locked{max-width:560px;margin:12vh auto;padding:34px;border:2px solid var(--admin-red);border-radius:22px;background:#fff}.locked h1{font-size:2.3rem;margin-top:0;color:var(--admin-red)}.locked p{opacity:.65;line-height:1.6}
    body.admin-theme-dark{background:#0d0d0d;color:#f5f5f5}body.admin-theme-dark .admin-side,body.admin-theme-dark .admin-content,body.admin-theme-dark .stat,body.admin-theme-dark .panel-head,body.admin-theme-dark .admin-card,body.admin-theme-dark .user-chip,body.admin-theme-dark .logout,body.admin-theme-dark .locked{background:#171717;color:#f5f5f5;border-color:#333}body.admin-theme-dark .admin-card p{color:#ddd}body.admin-theme-dark .side-nav button{color:#f5f5f5}body.admin-theme-dark .side-nav button:hover{background:#222;border-color:#444}body.admin-theme-dark .side-nav button.active{background:#fff;color:#111}body.admin-theme-dark .admin-actions button,body.admin-theme-dark .admin-actions select,body.admin-theme-dark .admin-form input,body.admin-theme-dark .admin-form textarea,body.admin-theme-dark .admin-form select{background:#222;color:#fff;border-color:#555}.admin-actions button:focus-visible,.admin-actions select:focus-visible,.side-nav button:focus-visible{outline:3px solid var(--admin-yellow);outline-offset:2px}
    @media(max-width:850px){.admin-shell{grid-template-columns:1fr}.admin-side{position:static;height:auto;border-radius:18px;padding:12px}.brand-mini{padding:5px 5px 12px}.side-nav{display:flex;overflow:auto;padding-top:10px}.side-nav button{white-space:nowrap;width:auto;min-width:max-content}.side-footer{display:none}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.admin-wrap{padding:12px 12px 80px}.admin-top{align-items:flex-start}.user-chip{display:none}.stats{gap:8px}.stat{padding:14px}.stat strong{font-size:1.55rem}.admin-content{border-radius:17px}.panel-head{padding:15px}.admin-card{padding:16px}.admin-top h1{font-size:2.25rem}}
  </style>
</head>
<body>
  <main class="admin-wrap">
    <section id="loading" class="empty"><strong>A verificar acesso administrativo…</strong></section>
    <section id="locked" class="locked" hidden><span class="eyebrow">NZINGA CREATIVES</span><h1>Acesso restrito</h1><p>A tua conta está autenticada, mas não possui permissões administrativas.</p><a class="button" href="minha-nzinga.html">Voltar para Minha Nzinga</a></section>
    <section id="app" hidden class="admin-shell">
      <aside class="admin-side">
        <div class="brand-mini"><div class="brand-mark">N</div><div><strong>Nzinga Admin</strong><span>Painel de controlo</span></div></div>
        <nav class="side-nav" aria-label="Secções administrativas">
          <button type="button" data-tab="products" class="active"><span>▦</span><span>Market</span></button>
          <button type="button" data-tab="orders"><span>◷</span><span>Pedidos</span></button>
          <button type="button" data-tab="reviews"><span>★</span><span>Avaliações</span></button>
          <button type="button" data-tab="users"><span>♙</span><span>Utilizadores</span></button>
        </nav>
        <div class="side-footer"><button id="logout" class="logout" type="button">Sair da conta</button></div>
      </aside>
      <section class="admin-main">
        <header class="admin-top"><div><span class="eyebrow">NZINGA CREATIVES / ADMIN</span><h1>Visão geral</h1><p>Resumo e gestão das áreas administrativas.</p></div><div class="user-chip"><i class="dot"></i><span id="adminEmail">Sessão ativa</span></div></header>
        <div id="stats" class="stats" aria-label="Resumo administrativo"></div>
        <div class="admin-content">
          <div id="panel-products" class="admin-panel"></div>
          <div id="panel-orders" class="admin-panel" hidden></div>
          <div id="panel-reviews" class="admin-panel" hidden></div>
          <div id="panel-users" class="admin-panel" hidden></div>
        </div>
      </section>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
  (()=>{const sb=window.supabase.createClient(window.NZINGA_SUPABASE.url,window.NZINGA_SUPABASE.publishableKey);const $=id=>document.getElementById(id);async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){location.href='minha-nzinga.html';return}const {data:admin,error}=await sb.from('admin_users').select('role').eq('user_id',session.user.id).maybeSingle();if(error||!admin){$('loading').hidden=true;$('locked').hidden=false;return}$('adminEmail').textContent=session.user.email||'Administrador';$('loading').hidden=true;$('app').hidden=false}$('logout').onclick=async()=>{await sb.auth.signOut();location.href='minha-nzinga.html'};boot()})();
  </script>
</body>
</html>
