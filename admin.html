<!doctype html>
<html lang="pt-AO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0a0a0a">
  <title>Admin — Nzinga Creatives</title>
  <link rel="stylesheet" href="style.css">
  <style>
    :root{--admin-accent:#e21d2f;--admin-yellow:#f2c94c;--admin-line:rgba(127,127,127,.24);--admin-soft:rgba(127,127,127,.07)}
    body{background:#080808;color:#f5f5f5}
    .admin-wrap{max-width:1280px;margin:auto;padding:24px 18px 72px}
    .admin-shell{display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px;min-height:calc(100vh - 48px)}
    .admin-side{position:sticky;top:18px;height:calc(100vh - 36px);display:flex;flex-direction:column;border:1px solid var(--admin-line);border-radius:24px;background:rgba(18,18,18,.88);backdrop-filter:blur(18px);padding:18px}
    .brand-mini{display:flex;align-items:center;gap:10px;padding:8px 6px 22px;border-bottom:1px solid var(--admin-line)}
    .brand-mark{width:38px;height:38px;display:grid;place-items:center;border:1px solid #fff;border-radius:12px;font-weight:900}
    .brand-mini strong{font-size:.94rem}.brand-mini span{display:block;opacity:.55;font-size:.72rem;margin-top:2px}
    .side-nav{display:grid;gap:6px;padding-top:18px}.side-nav button{width:100%;text-align:left;border:0;background:transparent;color:inherit;padding:12px 13px;border-radius:12px;cursor:pointer;font:inherit;display:flex;align-items:center;gap:10px}.side-nav button:hover{background:var(--admin-soft)}.side-nav button.active{background:#fff;color:#050505;font-weight:800}
    .side-footer{margin-top:auto;border-top:1px solid var(--admin-line);padding-top:14px}.logout{width:100%;border:1px solid var(--admin-line);background:transparent;color:inherit;padding:11px;border-radius:11px;cursor:pointer}
    .admin-main{min-width:0}.admin-top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.eyebrow{font-size:.73rem;letter-spacing:.15em;opacity:.55;font-weight:800}.admin-top h1{font-size:clamp(2rem,5vw,3.5rem);line-height:.98;margin:.3em 0}.admin-top p{opacity:.62;margin:0}.user-chip{display:flex;align-items:center;gap:9px;border:1px solid var(--admin-line);border-radius:999px;padding:8px 12px;font-size:.82rem;white-space:nowrap}.dot{width:8px;height:8px;border-radius:50%;background:#51cf66}
    .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}.stat{border:1px solid var(--admin-line);border-radius:18px;padding:18px;background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.015));position:relative;overflow:hidden}.stat:after{content:"";position:absolute;width:70px;height:70px;border-radius:50%;right:-25px;top:-25px;background:rgba(226,29,47,.12)}.stat span{font-size:.78rem;opacity:.58}.stat strong{display:block;font-size:2rem;margin-top:7px}.stat small{opacity:.5}
    .admin-content{border:1px solid var(--admin-line);border-radius:22px;background:rgba(14,14,14,.8);overflow:hidden}.panel-head{padding:18px 20px;border-bottom:1px solid var(--admin-line);display:flex;justify-content:space-between;align-items:center;gap:12px}.panel-head h2{margin:0;font-size:1.05rem}.panel-head span{font-size:.78rem;opacity:.5}.admin-panel{display:grid;gap:0}
    .admin-card{padding:18px 20px;border-bottom:1px solid var(--admin-line);background:transparent;transition:background .2s}.admin-card:last-child{border-bottom:0}.admin-card:hover{background:rgba(255,255,255,.025)}.admin-card h2{margin:5px 0 7px;font-size:1.1rem}.admin-meta{font-size:.74rem;opacity:.52;text-transform:uppercase;letter-spacing:.05em}.admin-card p{line-height:1.5;opacity:.75;margin:7px 0}.admin-card strong{opacity:1}
    .admin-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.admin-actions button,.admin-actions select{border:1px solid var(--admin-line);background:#111;color:inherit;padding:9px 12px;border-radius:10px;cursor:pointer}.admin-actions .approve{background:#fff;color:#050505;border-color:#fff;font-weight:800}.admin-actions .danger{border-color:rgba(226,29,47,.7)}
    .admin-form{display:grid;gap:9px;margin-top:13px;padding:14px;border-radius:14px;background:var(--admin-soft)}.admin-form input,.admin-form textarea,.admin-form select{padding:11px;border:1px solid var(--admin-line);background:#0b0b0b;color:inherit;border-radius:9px;font:inherit}.admin-form textarea{min-height:90px;resize:vertical}.status{min-height:1.3em;margin:0!important;font-size:.82rem}
    .locked{max-width:560px;margin:12vh auto;padding:34px;border:1px solid rgba(226,29,47,.5);border-radius:22px;background:#111}.locked h1{font-size:2.3rem;margin-top:0}.locked p{opacity:.65;line-height:1.6}
    .empty{padding:40px 20px;text-align:center;opacity:.5}.empty strong{display:block;opacity:1;margin-bottom:5px}
    @media(max-width:850px){.admin-shell{grid-template-columns:1fr}.admin-side{position:static;height:auto;border-radius:18px;padding:12px}.brand-mini{padding:5px 5px 12px}.side-nav{display:flex;overflow:auto;padding-top:10px}.side-nav button{white-space:nowrap;width:auto}.side-footer{display:none}.stats{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:560px){.admin-wrap{padding:12px 12px 80px}.admin-top{align-items:flex-start}.user-chip{display:none}.stats{gap:8px}.stat{padding:14px}.stat strong{font-size:1.6rem}.admin-content{border-radius:17px}.panel-head{padding:15px}.admin-card{padding:16px}.admin-top h1{font-size:2.25rem}}
    @media(prefers-color-scheme:light){body{background:#f6f6f6;color:#111}.admin-side,.admin-content{background:rgba(255,255,255,.9)}.stat{background:#fff}.admin-actions button,.admin-actions select,.admin-form input,.admin-form textarea,.admin-form select{background:#fff;color:#111}.admin-form{background:#f4f4f4}.admin-form input,.admin-form textarea,.admin-form select{border-color:#ccc}.admin-actions button{border-color:#ccc}.side-nav button.active{background:#111;color:#fff}.brand-mark{border-color:#111}}
  </style>
</head>
<body>
  <main class="admin-wrap">
    <section id="loading">A verificar acesso administrativo…</section>
    <section id="locked" class="locked" hidden><span class="eyebrow">NZINGA CREATIVES</span><h1>Acesso restrito</h1><p>A tua conta está autenticada, mas não possui permissões administrativas.</p><a class="button" href="minha-nzinga.html">Voltar para Minha Nzinga</a></section>
    <section id="app" hidden class="admin-shell">
      <aside class="admin-side">
        <div class="brand-mini"><div class="brand-mark">N</div><div><strong>Nzinga Admin</strong><span>Painel de controlo</span></div></div>
        <nav class="side-nav" aria-label="Secções administrativas">
          <button data-tab="products" class="active"><span>▦</span> Market</button>
          <button data-tab="orders"><span>◷</span> Pedidos</button>
          <button data-tab="reviews"><span>★</span> Avaliações</button>
          <button data-tab="users"><span>♙</span> Utilizadores</button>
        </nav>
        <div class="side-footer"><button id="logout" class="logout">Sair da conta</button></div>
      </aside>
      <section class="admin-main">
        <header class="admin-top"><div><span class="eyebrow">NZINGA CREATIVES / ADMIN</span><h1>Centro de controlo</h1><p>Moderação, pedidos e comunidade.</p></div><div class="user-chip"><i class="dot"></i><span id="adminEmail">Sessão ativa</span></div></header>
        <div id="stats" class="stats"></div>
        <div class="admin-content">
          <div id="panel-products" class="admin-panel"></div>
          <div id="panel-orders" class="admin-panel" hidden></div>
          <div id="panel-reviews" class="admin-panel" hidden></div>
          <div id="panel-users" class="admin-panel" hidden></div>
        </div>
      </section>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
  <script>
  (()=>{
    const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const sb=window.supabase.createClient(window.NZINGA_SUPABASE.url,window.NZINGA_SUPABASE.publishableKey);let user;
    const money=(v,c='AOA')=>`${Number(v||0).toLocaleString('pt-AO',{minimumFractionDigits:2,maximumFractionDigits:2})} ${c}`;
    const head=(title,count)=>`<div class="panel-head"><h2>${title}</h2><span>${count} registo${count===1?'':'s'}</span></div>`;
    async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){location.href='minha-nzinga.html';return}user=session.user;$('adminEmail').textContent=user.email||'Administrador';const {data:admin,error}=await sb.from('admin_users').select('role').eq('user_id',user.id).maybeSingle();if(error||!admin){$('loading').hidden=true;$('locked').hidden=false;return}$('loading').hidden=true;$('app').hidden=false;await refreshAll()}
    async function refreshAll(){await Promise.all([loadProducts(),loadOrders(),loadReviews(),loadUsers()]);const counts=[['Produtos','panel-products'],['Pedidos','panel-orders'],['Avaliações','panel-reviews'],['Utilizadores','panel-users']];$('stats').innerHTML=counts.map(([name,id])=>`<div class="stat"><span>${name}</span><strong>${$(id).dataset.count||0}</strong><small>Total atual</small></div>`).join('')}
    async function loadProducts(){const {data,error}=await sb.from('market_products').select('*').order('created_at',{ascending:false});const p=$('panel-products');if(error){p.innerHTML='<div class="empty">Não foi possível carregar o Market.</div>';return}p.dataset.count=data.length;p.innerHTML=head('Produtos do Market',data.length)+(data.length?data.map(x=>`<article class="admin-card"><span class="admin-meta">${esc(x.category)} · ${esc(x.status)}</span><h2>${esc(x.title)}</h2><p>${esc(x.description||'Sem descrição')}</p><p><strong>${money(x.price,x.currency)}</strong></p>${x.rejection_reason?`<p class="admin-meta">Motivo: ${esc(x.rejection_reason)}</p>`:''}<div class="admin-actions"><button class="approve" data-publish="${x.id}">Aprovar / Publicar</button><button class="danger" data-archive="${x.id}">Arquivar</button><button data-edit="${x.id}">Editar</button></div><form class="admin-form" data-form="${x.id}" hidden><input name="title" value="${esc(x.title)}" maxlength="120" required><textarea name="description" maxlength="1000">${esc(x.description||'')}</textarea><input name="price" type="number" min="0" step="0.01" value="${Number(x.price||0)}"><button type="submit">Guardar alterações</button><p class="status"></p></form></article>`).join(''):'<div class="empty"><strong>Market limpo</strong>Nenhum produto submetido.</div>');bindProductActions()}
    function bindProductActions(){document.querySelectorAll('[data-publish]').forEach(b=>b.onclick=async()=>{await updateProduct(b.dataset.publish,{status:'published',rejection_reason:null,reviewed_at:new Date().toISOString(),reviewed_by:user.id})});document.querySelectorAll('[data-archive]').forEach(b=>b.onclick=async()=>{const reason=prompt('Motivo da rejeição/arquivamento (opcional):')??'';await updateProduct(b.dataset.archive,{status:'archived',rejection_reason:reason,reviewed_at:new Date().toISOString(),reviewed_by:user.id})});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const f=document.querySelector(`[data-form="${b.dataset.edit}"]`);f.hidden=!f.hidden});document.querySelectorAll('[data-form]').forEach(f=>f.onsubmit=async e=>{e.preventDefault();const fd=new FormData(f);await updateProduct(f.dataset.form,{title:String(fd.get('title')).trim(),description:String(fd.get('description')).trim(),price:Number(fd.get('price'))},f.querySelector('.status'))})}
    async function updateProduct(id,patch,statusEl){const {error}=await sb.from('market_products').update(patch).eq('id',id);if(statusEl)statusEl.textContent=error?'Erro ao guardar.':'Guardado.';if(!error)await refreshAll()}
    async function loadOrders(){const {data,error}=await sb.from('orders').select('*').order('created_at',{ascending:false});const p=$('panel-orders');if(error){p.innerHTML='<div class="empty">Não foi possível carregar os pedidos.</div>';return}p.dataset.count=data.length;p.innerHTML=head('Pedidos',data.length)+(data.length?data.map(x=>`<article class="admin-card"><span class="admin-meta">${esc(new Date(x.created_at).toLocaleString('pt-AO'))}</span><h2>${esc(x.service)} — ${esc(x.tier)}</h2><p><strong>${esc(x.name)}</strong> · ${esc(x.contact)}</p><p>${esc(x.idea||'Sem detalhes')}</p><form class="admin-actions" data-order="${x.id}"><select name="status"><option ${x.status==='Pedido iniciado'?'selected':''}>Pedido iniciado</option><option ${x.status==='Aguardando pagamento'?'selected':''}>Aguardando pagamento</option><option ${x.status==='Em produção'?'selected':''}>Em produção</option><option ${x.status==='Concluído'?'selected':''}>Concluído</option><option ${x.status==='Cancelado'?'selected':''}>Cancelado</option></select><button type="submit">Atualizar status</button></form></article>`).join(''):'<div class="empty"><strong>Nenhum pedido</strong>Os novos pedidos aparecerão aqui.</div>');document.querySelectorAll('[data-order]').forEach(f=>f.onsubmit=async e=>{e.preventDefault();const fd=new FormData(f);const {error}=await sb.from('orders').update({status:fd.get('status')}).eq('id',f.dataset.order);if(!error)await refreshAll()})}
    async function loadReviews(){const {data,error}=await sb.from('reviews').select('*').order('created_at',{ascending:false});const p=$('panel-reviews');if(error){p.innerHTML='<div class="empty">Não foi possível carregar as avaliações.</div>';return}p.dataset.count=data.length;p.innerHTML=head('Avaliações',data.length)+(data.length?data.map(x=>`<article class="admin-card"><span class="admin-meta">${esc(x.stars)} / 5 · ${esc(x.status)}</span><p>${esc(x.text)}</p><div class="admin-actions"><button data-review="${x.id}" data-value="${x.status==='published'?'hidden':'published'}">${x.status==='published'?'Ocultar':'Publicar'}</button></div></article>`).join(''):'<div class="empty"><strong>Nenhuma avaliação</strong>A comunidade ainda não enviou avaliações.</div>');document.querySelectorAll('[data-review]').forEach(b=>b.onclick=async()=>{const {error}=await sb.from('reviews').update({status:b.dataset.value,moderated_at:new Date().toISOString(),moderated_by:user.id}).eq('id',b.dataset.review);if(!error)await refreshAll()})}
    async function loadUsers(){const {data,error}=await sb.from('profiles').select('id,name,contact,created_at').order('created_at',{ascending:false});const p=$('panel-users');if(error){p.innerHTML='<div class="empty">Não foi possível carregar utilizadores.</div>';return}p.dataset.count=data.length;p.innerHTML=head('Utilizadores',data.length)+(data.length?data.map(x=>`<article class="admin-card"><h2>${esc(x.name||'Sem nome')}</h2><p>${esc(x.contact||'Sem contacto')}</p><span class="admin-meta">Conta criada em ${esc(new Date(x.created_at).toLocaleDateString('pt-AO'))}</span></article>`).join(''):'<div class="empty"><strong>Nenhum perfil</strong>Os perfis aparecerão aqui.</div>')}
    document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('[id^="panel-"]').forEach(x=>x.hidden=true);$('panel-'+b.dataset.tab).hidden=false});$('logout').onclick=async()=>{await sb.auth.signOut();location.href='minha-nzinga.html'};boot();
  })();
  </script>
</body></html>
