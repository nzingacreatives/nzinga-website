<!doctype html>
<html lang="pt-AO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>Admin — Nzinga Creatives</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="nzinga-identity-v3.css?v=2">
  <style>
    :root{--admin-red:#c91510;--admin-red-dark:#9d100c;--admin-yellow:#f7c515;--admin-yellow-soft:#332d12;--admin-black:#111;--admin-ink:#fff;--admin-paper:#181818;--admin-bg:#111;--admin-line:#333;--admin-soft:#202020}
    *{box-sizing:border-box}body{margin:0;background:var(--admin-bg)!important;color:var(--admin-ink)!important;font-family:inherit}.admin-wrap{max-width:1360px;margin:auto;padding:24px 18px 72px}.admin-shell{display:grid;grid-template-columns:245px minmax(0,1fr);gap:22px;min-height:calc(100vh - 48px)}
    .admin-side{position:sticky;top:18px;height:calc(100vh - 36px);display:flex;flex-direction:column;border:2px solid #333;border-radius:18px;background:#181818!important;padding:16px;box-shadow:7px 7px 0 var(--admin-red)}.brand-mini{display:flex;align-items:center;gap:11px;padding:8px 6px 20px;border-bottom:2px solid var(--admin-yellow)}.brand-mark{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;background:var(--admin-red);color:#fff;font-weight:900}.brand-mini strong{font-size:.95rem;color:#fff}.brand-mini span{display:block;color:#aaa;font-size:.72rem;margin-top:2px}
    .side-nav{display:grid;gap:7px;padding-top:18px}.side-nav button{width:100%;border:1px solid transparent;background:transparent;color:#ddd;padding:12px 13px;border-radius:10px;cursor:pointer;font:inherit;display:flex;align-items:center;gap:11px;font-weight:700;transition:.18s}.side-nav button:hover{background:#222;border-color:#444}.side-nav button.active{background:var(--admin-yellow);color:#111;font-weight:900;box-shadow:4px 4px 0 var(--admin-red)}.side-footer{margin-top:auto;border-top:1px solid #333;padding-top:14px}.logout{width:100%;border:1px solid #444;background:#222;color:#fff;padding:11px;border-radius:10px;cursor:pointer;font-weight:800}.logout:hover{border-color:var(--admin-red);color:#fff}
    .admin-main{min-width:0}.admin-top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.eyebrow{font-size:.72rem;letter-spacing:.15em;color:var(--admin-yellow)!important;font-weight:900}.admin-top h1{font-size:clamp(2rem,5vw,3.35rem);line-height:.98;margin:.3em 0;color:var(--admin-red)}.admin-top p{color:#aaa;margin:0}.user-chip{display:flex;align-items:center;gap:9px;border:1px solid #444;border-radius:999px;padding:8px 12px;font-size:.82rem;white-space:nowrap;background:#181818!important;color:#fff}.dot{width:8px;height:8px;border-radius:50%;background:var(--admin-yellow)}
    .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.stat{border:1px solid #3a3a3a;border-radius:14px;padding:17px;background:#181818!important;position:relative;overflow:hidden;box-shadow:5px 5px 0 #000}.stat:nth-child(1),.stat:nth-child(3){border-top:4px solid var(--admin-yellow)}.stat:nth-child(2),.stat:nth-child(4){border-top:4px solid var(--admin-red)}.stat span{font-size:.76rem;color:#aaa;font-weight:800}.stat strong{display:block;font-size:1.95rem;margin-top:7px;color:#fff}.stat small{color:#888}.stat-icon{float:right;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:#2b260e;color:var(--admin-yellow);font-weight:900}.stat:nth-child(2) .stat-icon,.stat:nth-child(4) .stat-icon{background:#351616;color:#ff625e}
    .admin-content{border:1px solid #3a3a3a;border-radius:18px;background:#181818!important;overflow:hidden;box-shadow:7px 7px 0 #000}.admin-panel{display:grid;gap:0}.panel-head{padding:18px 20px;border-bottom:2px solid var(--admin-red);display:flex;justify-content:space-between;align-items:center;gap:12px;background:#181818!important}.panel-head h2{margin:0;font-size:1.08rem;color:var(--admin-yellow)}.panel-head span{font-size:.78rem;color:#888}.admin-card{padding:18px 20px;border-bottom:1px solid #303030;background:#181818!important;transition:background .18s}.admin-card:hover{background:#202020!important}.admin-card:last-child{border-bottom:0}.admin-card h2{margin:5px 0 7px;font-size:1.08rem;color:#fff}.admin-meta{font-size:.72rem;color:#999;text-transform:uppercase;letter-spacing:.05em}.admin-card p{line-height:1.5;margin:7px 0;color:#ccc}.admin-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.admin-actions button,.admin-actions select{border:1px solid #444;background:#222;color:#fff;padding:9px 12px;border-radius:9px;cursor:pointer;font-weight:750}.admin-actions .approve{background:var(--admin-yellow);color:#111;border-color:#d6a900;font-weight:900}.admin-actions .danger,.nz-admin-delete{background:var(--admin-red)!important;color:#fff!important;border-color:var(--admin-red)!important}.admin-form{display:grid;gap:9px;margin-top:13px;padding:14px;border-radius:12px;background:#202020!important}.admin-form input,.admin-form textarea,.admin-form select{padding:11px;border:1px solid #444;background:#111!important;color:#fff!important;border-radius:8px;font:inherit}.admin-form textarea{min-height:90px;resize:vertical}.status{min-height:1.3em;margin:0!important;font-size:.82rem;color:#ff625e}.empty{padding:42px 20px;text-align:center;color:#aaa}.empty strong{display:block;margin-bottom:5px;color:#fff}.locked{max-width:560px;margin:12vh auto;padding:34px;border:2px solid var(--admin-red);border-radius:18px;background:#181818!important;box-shadow:8px 8px 0 #000}.locked h1{font-size:2.3rem;margin-top:0;color:var(--admin-red)}.locked p{color:#bbb;line-height:1.6}
    @media(max-width:850px){.admin-shell{grid-template-columns:1fr}.admin-side{position:static;height:auto;border-radius:15px;padding:12px}.brand-mini{padding:5px 5px 12px}.side-nav{display:flex;overflow:auto;padding-top:10px}.side-nav button{white-space:nowrap;width:auto;min-width:max-content}.side-footer{display:none}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.admin-wrap{padding:12px 12px 80px}.admin-top{align-items:flex-start}.user-chip{display:none}.stats{gap:8px}.stat{padding:14px}.stat strong{font-size:1.55rem}.admin-content{border-radius:15px}.panel-head{padding:15px}.admin-card{padding:16px}.admin-top h1{font-size:2.25rem}}
  </style>
</head>
<body>
  <main class="admin-wrap">
    <section id="loading" class="empty"><strong>A verificar acesso administrativo…</strong></section>
    <section id="locked" class="locked" hidden><span class="eyebrow">NZINGA CREATIVES</span><h1>Acesso restrito</h1><p>A tua conta está autenticada, mas não possui permissões administrativas.</p><a class="button" href="minha-nzinga.html">Voltar para Minha Nzinga</a></section>
    <section id="app" hidden class="admin-shell">
      <aside class="admin-side">
        <div class="brand-mini"><div class="brand-mark">N</div><div><strong>Nzinga Admin</strong><span>Painel de controlo</span></div></div>
        <nav class="side-nav" aria-label="Secções administrativas">
          <button type="button" data-tab="products" class="active"><span>▦</span><span>Market</span></button>
          <button type="button" data-tab="orders"><span>◷</span><span>Pedidos</span></button>
          <button type="button" data-tab="reviews"><span>★</span><span>Avaliações</span></button>
          <button type="button" data-tab="users"><span>♙</span><span>Utilizadores</span></button>
        </nav>
        <div class="side-footer"><button id="logout" class="logout" type="button">Sair da conta</button></div>
      </aside>
      <section class="admin-main">
        <header class="admin-top"><div><span class="eyebrow">NZINGA CREATIVES / ADMIN</span><h1>Visão geral</h1><p>Resumo e gestão das áreas administrativas.</p></div><div class="user-chip"><i class="dot"></i><span id="adminEmail">Sessão ativa</span></div></header>
        <div id="stats" class="stats" aria-label="Resumo administrativo"></div>
        <div class="admin-content">
          <div id="panel-products" class="admin-panel"></div>
          <div id="panel-orders" class="admin-panel" hidden></div>
          <div id="panel-reviews" class="admin-panel" hidden></div>
          <div id="panel-users" class="admin-panel" hidden></div>
        </div>
      </section>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
  (()=>{const sb=window.supabase.createClient(window.NZINGA_SUPABASE.url,window.NZINGA_SUPABASE.publishableKey);const $=id=>document.getElementById(id);async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){location.href='minha-nzinga.html';return}const {data:admin,error}=await sb.from('admin_users').select('role').eq('user_id',session.user.id).maybeSingle();if(error||!admin){$('loading').hidden=true;$('locked').hidden=false;return}$('adminEmail').textContent=session.user.email||'Administrador';$('loading').hidden=true;$('app').hidden=false}$('logout').onclick=async()=>{await sb.auth.signOut();location.href='minha-nzinga.html'};boot()})();
  </script>
</body>
</html>
