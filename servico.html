'Design gráfico':{def:'Criação de peças visuais para apresentar, divulgar ou identificar uma marca, produto, serviço ou ocasião.',explain:'O trabalho começa pelo objetivo da peça, pelo público e pela informação que precisa de aparecer. A composição, a hierarquia do texto e a escolha visual são ajustadas ao formato pedido.',include:['Organização da informação e do objetivo','Definição da direção visual da peça','Composição e preparação do design','Entrega digital no formato acordado'],good:'Marcas, pequenos negócios, organizações, estudantes e pessoas que precisam de comunicação visual.'},

};

const p=new URLSearchParams(location.search),name=p.get('servico')||'Serviço',area=p.get('area')||'Serviços',queryPrice=p.get('preco')||'',queryDef=p.get('def')||'',parsedPrice=queryPrice&&!queryPrice.toLowerCase().includes('partir')?Number(queryPrice):null,profile=profiles[area]||profiles['Design Gráfico'];
function detailFor(service,category,shortDef,base){
 const n=service.toLowerCase(),d=shortDef||base.def;
 let purpose='O trabalho é organizado para responder ao objetivo indicado, respeitando o formato e a utilização previstos.';
 let stages=['Alinhamento do objetivo e do público','Organização do conteúdo e dos elementos necessários','Desenvolvimento da peça conforme o serviço','Revisão e entrega no formato combinado'];
 let deliver='O resultado é preparado para a utilização indicada no pedido.';
 if(/logotipo|isotipo|monograma|ilustração|mockup|embalagem/.test(n)){purpose='A direção visual considera a personalidade da marca, a aplicação pretendida e a legibilidade em diferentes tamanhos.';stages=['Recolha do nome, contexto e referências da marca','Definição do conceito e da direção visual','Desenvolvimento e refinamento da proposta','Preparação dos ficheiros finais para utilização'];deliver='A entrega é ajustada às aplicações acordadas, como meios digitais ou materiais de comunicação.'}
 else if(/post|story|flyer|cartaz|banner|menu|convite|cartão|certificado|carrossel|infográfico|brochura|catálogo|apresentação/.test(n)){purpose='A composição dá prioridade à mensagem principal, à leitura rápida e à adaptação ao formato em que a peça será utilizada.';stages=['Recolha dos textos, imagens e informações','Definição da hierarquia e do formato','Composição visual e organização dos elementos','Preparação do ficheiro para publicação ou impressão, conforme combinado'];deliver='A peça é entregue no formato e nas dimensões definidos para o seu destino.'}
 else if(/roteiro|legenda|copy|bio|frases|mensagens|calendário|estratégia|gestão de conteúdo|pack/.test(n)){purpose='O conteúdo é estruturado para manter uma mensagem clara, adequada ao público e coerente com o canal de publicação.';stages=['Definição do objetivo, público e canal','Organização dos temas e da mensagem','Redação e adaptação ao formato solicitado','Revisão e entrega do conteúdo organizado'];deliver='O material é entregue em texto e organizado de acordo com o formato acordado.'}
 else if(/cv|currículo|carta|trabalho|formatação|proposta|orçamento|relatório|e-book|portfólio|documento/.test(n)){purpose='A informação é organizada para facilitar a leitura, destacar os dados importantes e corresponder à finalidade do documento.';stages=['Receção e análise do conteúdo fornecido','Organização das secções e da informação','Formatação e aplicação da hierarquia visual','Revisão e entrega do documento'];deliver='A entrega segue o formato combinado, mantendo o conteúdo fornecido e a finalidade do documento.'}
 else if(/site|página|landing|loja online|web|sistema|formulário|link|integração|otimização|manutenção|atualização/.test(n)){purpose='A solução é estruturada em função da informação que precisa de apresentar e da ação que deve facilitar ao visitante.';stages=['Levantamento dos objetivos e funcionalidades','Planeamento da estrutura e navegação','Desenvolvimento ou alteração da solução','Verificação em ecrãs e dispositivos diferentes'];deliver='O âmbito, as funcionalidades, os conteúdos e a forma de publicação são confirmados antes do início.'}
 else if(/vídeo|reels|tiktok|motion|animação|slideshow|intro|outro|trailer|audiovisual|edição de imagem/.test(n)){purpose='A edição respeita a mensagem, o ritmo e o formato final, utilizando os materiais fornecidos e os elementos acordados.';stages=['Definição do objetivo, duração e formato','Organização dos vídeos, imagens, áudio e textos','Montagem, edição ou animação da peça','Exportação e entrega no formato combinado'];deliver='A exportação é preparada para o canal ou dispositivo indicado no pedido.'}
 const desc=shortDef?shortDef+' '+purpose:base.explain+' '+purpose;
 return {area:category,price:parsedPrice,def:d,desc,include:stages,good:base.good,deliver};
}
const item=data[name]||detailFor(name,area,queryDef,profile),price=queryPrice?(queryPrice.toLowerCase().includes('partir')?queryPrice:Number(queryPrice).toLocaleString('pt-AO')+' Kz'):(item.price?item.price.toLocaleString('pt-AO')+' Kz':'A definir');

document.getElementById('app').innerHTML=`<section class="detail-hero"><a class="back" href="/servicos.html">← VOLTAR A SERVIÇOS</a><div class="detail-grid"><div><span class="eyebrow">${esc(area)} / SERVIÇO</span><h1>${esc(name)}<em>.</em></h1><p class="detail-desc">${esc(item.desc)}</p></div><div class="main-visual reference-panel"><img class="service-reference-image" src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=1400&q=85" alt="Mesa de trabalho criativo com computador e materiais de design" loading="lazy"><small>Imagem ilustrativa de referência visual.</small></div></div></section><section class="content"><section class="definition"><div><span class="eyebrow" style="color:#e52b2f">DEFINIÇÃO</span><h2>O que é?</h2></div><div><p><strong>${esc(item.def)}</strong></p><p>${esc(item.desc)}</p></div></section><section class="examples"><span class="eyebrow" style="color:#e52b2f">REFERÊNCIA VISUAL</span><h2>Uma referência.</h2><p>Imagem ilustrativa para ajudar a visualizar o ambiente de criação. Não representa um trabalho de cliente nem uma entrega da Nzinga.</p></section><section class="pricing"><span class="eyebrow">PREÇOS</span><h2>Quanto custa.</h2><div class="price-grid"><article class="price-box"><small>01 / NORMAL</small><h3>Normal</h3><strong>${price}</strong><p>Versão normal do serviço, com o que foi definido para esta opção.</p></article><article class="price-box"><small>02 / PREÇO DA CASA</small><h3>Preço da Casa</h3><strong>A definir</strong><p>Uma solução ajustada ao pedido, com valor definido conforme o serviço e o que o projeto exige.</p></article></div></section><section class="include"><div><span class="eyebrow" style="color:#e52b2f">O QUE INCLUI</span><h2>Na prática.</h2></div><div><ul>${item.include.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p style="color:#5d5a54;line-height:1.7;margin-top:30px"><strong>Ideal para:</strong> ${esc(item.good)}</p><p style="color:#5d5a54;line-height:1.7;margin-top:14px"><strong>Entrega:</strong> ${esc(item.deliver||"A entrega é definida conforme o formato e o âmbito acordados antes do início do trabalho.")}</p></div></section><section class="cta order-cta"><div><span class="eyebrow">ENCOMENDA / NZINGA CREATIVES</span><h2>Vamos começar?</h2><p>Preenche os dados essenciais. Trabalhamos uma encomenda de cada vez para manter o pedido simples e claro.</p><p class="experimental-note" id="experimentalNote" hidden>SERVIÇO EXPERIMENTAL · Ainda estamos a testar esta área. Podes manifestar interesse, mas a encomenda só será confirmada depois de conversarmos.</p><form id="orderForm" class="order-form"><h3>Briefing do projeto</h3><p>Responde ao que já sabes. A equipa poderá esclarecer os restantes detalhes contigo.</p><label>Nome completo<input id="orderName" required autocomplete="name" placeholder="O teu nome"></label><label>Contacto / WhatsApp<input id="orderContact" required autocomplete="tel" placeholder="+244 ..."></label><label>Localização<input id="orderLocation" required placeholder="Município, província ou país"></label><label id="orderTierLabel">Tipo de serviço<select id="orderTier"><option value="Normal">Normal</option><option value="Preço da Casa">Preço da Casa</option></select></label><label>Qual é o objetivo deste projeto?<input id="orderGoal" placeholder="Ex.: divulgar o negócio, apresentar um produto..."></label><label>Que estilo pretendes?<input id="orderStyle" placeholder="Ex.: simples, moderno, minimalista, colorido..."></label><label>Quais são as cores ou referências? <textarea id="orderReferences" placeholder="Cores, links, marcas ou exemplos de que gostas"></textarea></label><label>Conta-nos a tua ideia e o que precisas<textarea id="orderIdea" required placeholder="Descreve o projeto, o conteúdo e qualquer detalhe importante"></textarea></label><label>Imagens ou ficheiros de referência<input id="orderFiles" type="file" accept="image/*,.pdf" multiple><small>Os nomes dos ficheiros serão incluídos no pedido. Para os enviar, anexa-os também na conversa do WhatsApp.</small></label><div class="order-actions"><button type="button" id="orderAccount">Guardar na minha conta</button><button type="button" id="orderWhatsApp">Continuar pelo WhatsApp</button><button type="button" id="orderEmail">Enviar por e-mail</button></div><p id="orderStatus" class="order-status" aria-live="polite"></p><p class="order-login">Sem conta? Continua pelo WhatsApp ou <a href="/minha-nzinga.html">cria uma conta / entra</a>.</p></form></div><a href="/servicos.html">VER OUTROS SERVIÇOS →</a></section></section>`;
document.getElementById('menu').onclick=()=>document.getElementById('drawer').classList.toggle('open');document.querySelectorAll('.drawer a').forEach(a=>a.onclick=()=>document.getElementById('drawer').classList.remove('open'));
const orderForm=document.getElementById('orderForm');
if(experimental){document.getElementById('experimentalNote').hidden=false;document.getElementById('orderTierLabel').hidden=true;}
function orderData(){const files=[...document.getElementById('orderFiles').files].map(f=>f.name);return {service:name,tier:experimental?'Experimental':document.getElementById('orderTier').value,name:document.getElementById('orderName').value.trim(),contact:document.getElementById('orderContact').value.trim(),location:document.getElementById('orderLocation').value.trim(),goal:document.getElementById('orderGoal').value.trim(),style:document.getElementById('orderStyle').value.trim(),references:document.getElementById('orderReferences').value.trim(),idea:document.getElementById('orderIdea').value.trim(),files}}
function orderMessage(){const o=orderData();return 'Olá, Nzinga Creatives. Quero '+(experimental?'manifestar interesse no serviço experimental ':'encomendar ')+o.service+'.\nNome: '+o.name+'\nContacto: '+o.contact+'\nLocalização: '+o.location+'\nTipo: '+o.tier+'\nObjetivo: '+(o.goal||'A conversar')+'\nEstilo pretendido: '+(o.style||'A conversar')+'\nCores e referências: '+(o.references||'A conversar')+'\nIdeia e detalhes: '+o.idea+'\nFicheiros selecionados: '+(o.files.join(', ')||'Nenhum')+'\n\nVou anexar os ficheiros nesta conversa, se necessário.'}
document.getElementById('orderWhatsApp').onclick=()=>{if(!orderForm.reportValidity())return;window.open('https://wa.me/244949805066?text='+encodeURIComponent(orderMessage()),'_blank','noopener')};
document.getElementById('orderEmail').onclick=()=>{if(!orderForm.reportValidity())return;location.href='mailto:nzingacreatives@gmail.com?subject='+encodeURIComponent('Pedido Nzinga — '+name)+'&body='+encodeURIComponent(orderMessage())};
document.getElementById('orderAccount').onclick=async()=>{if(!orderForm.reportValidity())return;const status=document.getElementById('orderStatus');if(!window.supabase||!window.NZINGA_SUPABASE){status.textContent='Não foi possível ligar à conta. Usa WhatsApp ou e-mail.';return}try{const client=window.__nzingaOrderClient||(window.__nzingaOrderClient=window.supabase.createClient(window.NZINGA_SUPABASE.url,window.NZINGA_SUPABASE.publishableKey));const result=await client.auth.getSession();const session=result.data.session;if(!session){status.textContent='Ainda não tens sessão iniciada. Envia por WhatsApp/e-mail ou entra na tua conta.';return}const o=orderData();const saved=await client.from('orders').insert({user_id:session.user.id,service:o.service,tier:o.tier,name:o.name,contact:o.contact,idea:o.idea,status:experimental?'Interesse recebido':'Pedido recebido'});if(saved.error){status.textContent='Não foi possível guardar o pedido na conta. Podes enviá-lo pelo WhatsApp.';return}status.textContent=experimental?'Interesse registado na tua conta. A equipa entrará em contacto.':'Pedido registado na tua conta. A equipa entrará em contacto.';orderForm.reset()}catch(err){status.textContent='Ocorreu um erro. Tenta WhatsApp ou e-mail.'}};
</script></body></html>
