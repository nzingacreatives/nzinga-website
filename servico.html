function selectedValues(selector){return [...document.querySelectorAll(selector+':checked')].map(x=>x.value)}
function orderData(){return {service:name,tier:experimental?'Experimental':document.getElementById('orderTier').value,name:document.getElementById('orderName').value.trim(),contact:document.getElementById('orderContact').value.trim(),location:document.getElementById('orderLocation').value.trim(),goal:document.getElementById('orderGoal').value.trim(),audience:document.getElementById('orderAudience').value.trim(),use:document.getElementById('orderUse').value.trim(),format:document.getElementById('orderFormat').value.trim(),deadline:document.getElementById('orderDeadline').value.trim(),style:selectedValues('#styleChoices input').concat(document.getElementById('orderStyleOther').value.trim()).filter(Boolean).join(', '),colors:selectedValues('#colorPalette input').concat(document.getElementById('orderColorOther').value.trim()).filter(Boolean).join(', '),references:document.getElementById('orderReferences').value.trim(),idea:document.getElementById('orderIdea').value.trim()+'\\n\\nBriefing específico: '+[...document.querySelectorAll('#serviceBriefFields [data-brief]')].map(x=>x.dataset.brief+': '+x.value.trim()).filter(x=>!x.endsWith(': ')).join('\\n'),files:[...document.getElementById('orderFiles').files]}}
function orderMessage(o,attachments){const links=attachments.map(a=>a.name+': '+a.url);return 'Olá, Nzinga Creatives. Quero '+(experimental?'manifestar interesse no serviço experimental ':'encomendar ')+o.service+'.\\nNome: '+o.name+'\\nWhatsApp / contacto: '+o.contact+'\\nLocalização: '+o.location+'\\nPacote: '+o.tier+'\\nObjetivo: '+(o.goal||'A conversar')+'\\nPúblico-alvo: '+(o.audience||'A definir')+'\\nUtilização: '+(o.use||'A definir')+'\\nFormato: '+(o.format||'A definir')+'\\nPrazo pretendido: '+(o.deadline||'A combinar')+'\\nEstilo pretendido: '+(o.style||'A definir')+'\\nCores escolhidas: '+(o.colors||'A definir')+'\\nReferências: '+(o.references||'A conversar')+'\\nIdeia e detalhes: '+o.idea+'\\n\\nANEXOS (links para abrir/transferir):\\n'+(links.length?links.join('\\n'):'Nenhum')+'\\n\\nOs links dos anexos ficam disponíveis durante 7 dias.'}
function makeId(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16)})}
async function uploadBriefFiles(client,session){const files=orderData().files;if(!files.length)return [];const status=document.getElementById('orderStatus');if(files.length>8)throw new Error('Seleciona no máximo 8 ficheiros.');const total=files.reduce((n,f)=>n+f.size,0);if(total>50*1024*1024)throw new Error('O conjunto dos ficheiros não pode ultrapassar 50 MB.');const requestId=makeId(),folder=session?session.user.id:'guest';const attachments=[];for(let i=0;i<files.length;i++){const f=files[i];if(f.size>20*1024*1024)throw new Error('O ficheiro '+f.name+' ultrapassa 20 MB.');const safe=f.name.normalize('NFKD').replace(/[^a-zA-Z0-9._-]+/g,'_').slice(-100);const path=folder+'/'+requestId+'/'+(i+1)+'-'+safe;status.textContent='A enviar ficheiros ('+(i+1)+'/'+files.length+')…';const up=await client.storage.from('project-briefs').upload(path,f,{contentType:f.type||'application/octet-stream',upsert:false});if(up.error)throw up.error;const signed=await client.storage.from('project-briefs').createSignedUrl(path,604800);if(signed.error)throw signed.error;attachments.push({path,name:f.name,url:signed.data.signedUrl})}return attachments}
const filesInput=document.getElementById('orderFiles');filesInput.addEventListener('change',()=>{const files=[...filesInput.files],list=document.getElementById('fileList');list.innerHTML='';if(!files.length){list.textContent='Ainda não selecionaste ficheiros.';return}const names=document.createElement('p');names.textContent=files.map(f=>f.name+' ('+(f.size/1048576).toFixed(1)+' MB)').join(' · ');list.appendChild(names);const images=files.filter(f=>f.type.startsWith('image/'));if(images.length){const grid=document.createElement('div');grid.className='file-preview-grid';images.forEach(f=>{const card=document.createElement('div');card.className='file-preview';const img=document.createElement('img');img.src=URL.createObjectURL(f);img.alt=f.name;const link=document.createElement('a');link.href=img.src;link.target='_blank';link.rel='noopener';link.appendChild(img);const caption=document.createElement('span');caption.textContent=f.name;card.append(link,caption);grid.appendChild(card)});list.appendChild(grid)}});
const status=document.getElementById('orderStatus');
async function getOrderClient(){if(!window.supabase||!window.NZINGA_SUPABASE)throw new Error('Não foi possível ligar ao armazenamento.');return window.__nzingaOrderClient||(window.__nzingaOrderClient=window.supabase.createClient(window.NZINGA_SUPABASE.url,window.NZINGA_SUPABASE.publishableKey))}
document.getElementById('orderWhatsApp').onclick=async()=>{if(!validateAllSteps())return;const popup=window.open('about:blank','_blank');if(!popup){status.textContent='Permite a abertura de janelas para continuar pelo WhatsApp.';return}const btn=document.getElementById('orderWhatsApp');btn.disabled=true;try{const client=await getOrderClient(),auth=await client.auth.getSession(),session=auth.data.session,o=orderData(),paths=await uploadBriefFiles(client,session);popup.location.href='https://wa.me/244949805066?text='+encodeURIComponent(orderMessage(o,paths))}catch(e){popup.close();status.textContent='Não foi possível preparar o pedido: '+(e.message||'erro no envio dos ficheiros')}finally{btn.disabled=false}};
document.getElementById('orderEmail').onclick=async()=>{if(!validateAllSteps())return;try{const client=await getOrderClient(),auth=await client.auth.getSession(),o=orderData(),paths=await uploadBriefFiles(client,auth.data.session);location.href='mailto:nzingacreatives@gmail.com?subject='+encodeURIComponent('Pedido Nzinga — '+name)+'&body='+encodeURIComponent(orderMessage(o,paths))}catch(e){status.textContent='Não foi possível preparar o pedido: '+(e.message||'erro no envio dos ficheiros')}};
document.getElementById('orderAccount').onclick=async()=>{if(!validateAllSteps())return;const btn=document.getElementById('orderAccount');btn.disabled=true;try{const client=await getOrderClient(),auth=await client.auth.getSession(),session=auth.data.session;if(!session){status.textContent='Entra na tua conta para guardar o pedido e os ficheiros. Também podes continuar pelo WhatsApp.';return}const o=orderData(),paths=await uploadBriefFiles(client,session);const saved=await client.from('orders').insert({user_id:session.user.id,service:o.service,tier:o.tier,name:o.name,contact:o.contact,idea:[o.idea,'Objetivo: '+o.goal,'Público-alvo: '+o.audience,'Utilização: '+o.use,'Formato: '+o.format,'Prazo pretendido: '+o.deadline,'Estilo: '+o.style,'Cores: '+o.colors,'Localização: '+o.location,'Referências: '+o.references,'Ficheiros no armazenamento: '+paths.join(', ')].filter(Boolean).join('\n\n'),status:'Pedido iniciado'});if(saved.error)throw saved.error;status.textContent=experimental?'Interesse registado na tua conta.':'Pedido guardado na tua conta. A equipa entrará em contacto.';orderForm.reset();document.getElementById('fileList').textContent='Ainda não selecionaste ficheiros.'}catch(e){status.textContent='Não foi possível guardar o pedido: '+(e.message||'erro inesperado')}finally{btn.disabled=false}};
</script></body></html>
