 ALTO</small><h3>Pacote Alto</h3><p>Para projetos mais abrangentes ou exigentes. Pode contemplar maior personalização, planeamento, recursos e acompanhamento, definidos de acordo com o projeto.</p></article></div><p class="pricing-note">Referência atual do catálogo: <strong>${price}</strong>. Este valor não substitui o orçamento final. A proposta é preparada depois de compreendermos o pedido, a complexidade e o trabalho necessário. O Pacote Alto tem orçamento personalizado.</p></section><section class="include"><div><span class="eyebrow" style="color:#e52b2f">O QUE INCLUI</span><h2>Na prática.</h2></div><div><ul>${item.include.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p style="color:#5d5a54;line-height:1.7;margin-top:30px"><strong>Ideal para:</strong> ${esc(item.good)}</p><p style="color:#5d5a54;line-height:1.7;margin-top:14px"><strong>Entrega:</strong> ${esc(item.deliver||"A entrega é definida conforme o formato e o âmbito acordados antes do início do trabalho.")}</p></div></section><p class="service-support" style="margin:70px 0 0;padding:18px 0;border-top:1px solid #bbb5aa;color:#514e48;line-height:1.7">Precisas de esclarecer alguma coisa antes de pedir um orçamento? <a href="https://wa.me/244949805066" target="_blank" rel="noopener" style="color:#c91f25;text-decoration:underline;font-weight:700">Contacta o apoio Nzinga pelo WhatsApp</a> ou escreve para <a href="mailto:nzingacreatives@gmail.com" style="color:#c91f25;text-decoration:underline;font-weight:700">nzingacreatives@gmail.com</a>.</p><section class="cta order-cta"><div><span class="eyebrow">ENCOMENDA / NZINGA CREATIVES</span><h2>Vamos começar?</h2><p>Preenche os dados essenciais. Trabalhamos uma encomenda de cada vez para manter o pedido simples e claro.</p><p class="experimental-note" id="experimentalNote" hidden>SERVIÇO EXPERIMENTAL · Ainda estamos a testar esta área. Podes manifestar interesse, mas a encomenda só será confirmada depois de conversarmos.</p><form id="orderForm" class="order-form"><h3>Briefing do projeto</h3><p>Responde ao que já sabes. A equipa poderá esclarecer os restantes detalhes contigo.</p><label>Nome completo<input id="orderName" required autocomplete="name" placeholder="O teu nome"></label><label>Contacto / WhatsApp (recomendado)<input id="orderContact" type="tel" inputmode="tel" required autocomplete="tel" placeholder="+244 9XX XXX XXX"><small>Indica um número ativo. Preferimos WhatsApp para esclarecer detalhes e enviar atualizações.</small></label><label>Localização<input id="orderLocation" required placeholder="Município, província ou país"></label><label id="orderTierLabel">Tipo de serviço<select id="orderTier"><option value="Normal">Normal</option><option value="Preço da Casa">Preço da Casa</option></select></label><label>Qual é o objetivo deste projeto?<input id="orderGoal" placeholder="Ex.: divulgar o negócio, apresentar um produto..."></label><fieldset class="brief-field"><legend>Que estilo procuras?</legend><p class="brief-hint">Podes escolher mais de um. Se não encontrares o que procuras, escolhe “Outro”.</p><div class="choice-grid" id="styleChoices"><label><input type="checkbox" value="Minimalista"><span>Minimalista</span></label><label><input type="checkbox" value="Moderno"><span>Moderno</span></label><label><input type="checkbox" value="Elegante"><span>Elegante</span></label><label><input type="checkbox" value="Clássico"><span>Clássico</span></label><label><input type="checkbox" value="Criativo"><span>Criativo</span></label><label><input type="checkbox" value="Corporativo"><span>Corporativo</span></label><label><input type="checkbox" value="Luxuoso"><span>Luxuoso</span></label><label><input type="checkbox" value="Colorido"><span>Colorido</span></label><label><input type="checkbox" value="Vintage"><span>Vintage</span></label><label><input type="checkbox" value="Outro"><span>Outro</span></label></div><input id="orderStyleOther" placeholder="Descreve o estilo que tens em mente" aria-label="Outro estilo"></fieldset><fieldset class="brief-field"><legend>Escolhe as cores</legend><p class="brief-hint">Toca nas cores que gostarias de ver no projeto. Podes selecionar várias.</p><div class="color-palette" id="colorPalette"><label title="Preto"><input type="checkbox" value="Preto"><i style="--swatch:#090909"></i><span>Preto</span></label><label title="Branco"><input type="checkbox" value="Branco"><i style="--swatch:#fff"></i><span>Branco</span></label><label title="Vermelho"><input type="checkbox" value="Vermelho"><i style="--swatch:#e52b2f"></i><span>Vermelho</span></label><label title="Amarelo"><input type="checkbox" value="Amarelo"><i style="--swatch:#f3c62f"></i><span>Amarelo</span></label><label title="Azul"><input type="checkbox" value="Azul"><i style="--swatch:#17264a"></i><span>Azul</span></label><label title="Verde"><input type="checkbox" value="Verde"><i style="--swatch:#26845b"></i><span>Verde</span></label><label title="Roxo"><input type="checkbox" value="Roxo"><i style="--swatch:#7546a8"></i><span>Roxo</span></label><label title="Rosa"><input type="checkbox" value="Rosa"><i style="--swatch:#e88bb5"></i><span>Rosa</span></label><label title="Castanho"><input type="checkbox" value="Castanho"><i style="--swatch:#875b3e"></i><span>Castanho</span></label><label title="Laranja"><input type="checkbox" value="Laranja"><i style="--swatch:#ef8735"></i><span>Laranja</span></label></div><label class="custom-color">Outra cor / código HEX<input id="orderColorOther" placeholder="Ex.: Turquesa ou #24A6A6"></label><label class="custom-color">Tens uma referência visual ou paleta própria?<textarea id="orderReferences" placeholder="Links, marcas, imagens de referência ou outras indicações"></textarea></label></fieldset><label>Qual é o objetivo do projeto?<select id="orderGoal"><option value="">Seleciona uma opção</option><option>Divulgar um negócio ou serviço</option><option>Apresentar um produto</option><option>Criar ou melhorar uma marca</option><option>Evento ou ocasião especial</option><option>Uso pessoal ou académico</option><option>Outro objetivo</option></select></label><label>A quem se destina este projeto?<input id="orderAudience" placeholder="Ex.: jovens, clientes de uma loja, estudantes..."></label><label>Onde será utilizado?<select id="orderUse"><option value="">Seleciona uma opção</option><option>Redes sociais</option><option>Impressão</option><option>Website ou plataforma digital</option><option>Apresentação ou uso profissional</option><option>Uso pessoal</option><option>Vários formatos</option><option>Outro / ainda não sei</option></select></label><label>Formato ou dimensão pretendida<input id="orderFormat" placeholder="Ex.: A4, story 1080×1920, site para telemóvel..."></label><label>Prazo ou data ideal<input id="orderDeadline" placeholder="Ex.: até 20 de novembro (vamos confirmar a disponibilidade)"></label><label>Conta-nos a tua ideia e o que precisas<textarea id="orderIdea" required placeholder="O que queres criar? Para quem? Que informações devem aparecer? Qual é o resultado que esperas?"></textarea></label><fieldset class="brief-field"><legend>Ficheiros e imagens de referência</legend><label class="upload-zone">Selecionar imagens ou ficheiros<input id="orderFiles" type="file" accept="image/*,.pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.zip" multiple><small>Até 8 ficheiros, 20 MB por ficheiro e 50 MB no total. Os ficheiros enviados ficam guardados em espaço privado da Nzinga.</small></label><p id="fileList" class="brief-hint">Ainda não selecionaste ficheiros.</p></fieldset><div class="order-actions"><button type="button" id="orderAccount">Guardar na minha conta</button><button type="button" id="orderWhatsApp">Continuar pelo WhatsApp</button><button type="button" id="orderEmail">Enviar por e-mail</button></div><p id="orderStatus" class="order-status" aria-live="polite"></p><p class="order-login">Sem conta? Continua pelo WhatsApp ou <a href="/minha-nzinga.html">cria uma conta / entra</a>.</p></form></div><a href="/servicos.html">VER OUTROS SERVIÇOS document.getElementById('menu').onclick=()=>document.getElementById('drawer').classList.toggle('open');document.querySelectorAll('.drawer a').forEach(a=>a.onclick=()=>document.getElementById('drawer').classList.remove('open'));
const orderForm=document.getElementById('orderForm');
if(experimental){document.getElementById('experimentalNote').hidden=false;document.getElementById('orderTierLabel').hidden=true;}
function selectedValues(selector){return [...document.querySelectorAll(selector+':checked')].map(x=>x.value)}
function orderData(){return {service:name,tier:experimental?'Experimental':document.getElementById('orderTier').value,name:document.getElementById('orderName').value.trim(),contact:document.getElementById('orderContact').value.trim(),location:document.getElementById('orderLocation').value.trim(),goal:document.getElementById('orderGoal').value.trim(),audience:document.getElementById('orderAudience').value.trim(),use:document.getElementById('orderUse').value.trim(),format:document.getElementById('orderFormat').value.trim(),deadline:document.getElementById('orderDeadline').value.trim(),style:selectedValues('#styleChoices input').concat(document.getElementById('orderStyleOther').value.trim()).filter(Boolean).join(', '),colors:selectedValues('#colorPalette input').concat(document.getElementById('orderColorOther').value.trim()).filter(Boolean).join(', '),references:document.getElementById('orderReferences').value.trim(),idea:document.getElementById('orderIdea').value.trim(),files:[...document.getElementById('orderFiles').files]}}
function orderMessage(o,paths){return 'Olá, Nzinga Creatives. Quero '+(experimental?'manifestar interesse no serviço experimental ':'encomendar ')+o.service+'.\nNome: '+o.name+'\nWhatsApp / contacto: '+o.contact+'\nLocalização: '+o.location+'\nTipo: '+o.tier+'\nObjetivo: '+(o.goal||'A conversar')+'\nPúblico-alvo: '+(o.audience||'A definir')+'\nUtilização: '+(o.use||'A definir')+'\nFormato: '+(o.format||'A definir')+'\nPrazo pretendido: '+(o.deadline||'A combinar')+'\nEstilo pretendido: '+(o.style||'A definir')+'\nCores escolhidas: '+(o.colors||'A definir')+'\nReferências: '+(o.references||'A conversar')+'\nIdeia e detalhes: '+o.idea+'\nFicheiros guardados: '+(paths.length?paths.join(', '):'Nenhum')+'\n\nOs ficheiros foram enviados para o armazenamento privado da Nzinga.'}
function makeId(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16)})}
async function uploadBriefFiles(client,session){const files=orderData().files;if(!files.length)return [];const status=document.getElementById('orderStatus');if(files.length>8)throw new Error('Seleciona no máximo 8 ficheiros.');const total=files.reduce((n,f)=>n+f.size,0);if(total>50*1024*1024)throw new Error('O conjunto dos ficheiros não pode ultrapassar 50 MB.');const requestId=makeId(),folder=session?session.user.id:'guest';const paths=[];for(let i=0;i<files.length;i++){const f=files[i];if(f.size>20*1024*1024)throw new Error('O ficheiro '+f.name+' ultrapassa 20 MB.');const safe=f.name.normalize('NFKD').replace(/[^a-zA-Z0-9._-]+/g,'_').slice(-100);const path=folder+'/'+requestId+'/'+(i+1)+'-'+safe;status.textContent='A enviar ficheiros ('+(i+1)+'/'+files.length+')…';const up=await client.storage.from('project-briefs').upload(path,f,{contentType:f.type||'application/octet-stream',upsert:false});if(up.error)throw up.error;paths.push(path)}return paths}
const filesInput=document.getElementById('orderFiles');filesInput.addEventListener('change',()=>{const files=[...filesInput.files],list=document.getElementById('fileList');list.textContent=files.length?files.map(f=>f.name+' ('+(f.size/1048576).toFixed(1)+' MB)').join(' · '):'Ainda não selecionaste ficheiros.'});
const status=document.getElementById('orderStatus');
async function getOrderClient(){if(!window.supabase||!window.NZINGA_SUPABASE)throw new Error('Não foi possível ligar ao armazenamento.');return window.__nzingaOrderClient||(window.__nzingaOrderClient=window.supabase.createClient(window.NZINGA_SUPABASE.url,window.NZINGA_SUPABASE.publishableKey))}
document.getElementById('orderWhatsApp').onclick=async()=>{if(!orderForm.reportValidity())return;const popup=window.open('about:blank','_blank');if(!popup){status.textContent='Permite a abertura de janelas para continuar pelo WhatsApp.';return}const btn=document.getElementById('orderWhatsApp');btn.disabled=true;try{const client=await getOrderClient(),auth=await client.auth.getSession(),session=auth.data.session,o=orderData(),paths=await uploadBriefFiles(client,session);popup.location.href='https://wa.me/244949805066?text='+encodeURIComponent(orderMessage(o,paths))}catch(e){popup.close();status.textContent='Não foi possível preparar o pedido: '+(e.message||'erro no envio dos ficheiros')}finally{btn.disabled=false}};
document.getElementById('orderEmail').onclick=async()=>{if(!orderForm.reportValidity())return;try{const client=await getOrderClient(),auth=await client.auth.getSession(),o=orderData(),paths=await uploadBriefFiles(client,auth.data.session);location.href='mailto:nzingacreatives@gmail.com?subject='+encodeURIComponent('Pedido Nzinga — '+name)+'&body='+encodeURIComponent(orderMessage(o,paths))}catch(e){status.textContent='Não foi possível preparar o pedido: '+(e.message||'erro no envio dos ficheiros')}};
document.getElementById('orderAccount').onclick=async()=>{if(!orderForm.reportValidity())return;const btn=document.getElementById('orderAccount');btn.disabled=true;try{const client=await getOrderClient(),auth=await client.auth.getSession(),session=auth.data.session;if(!session){status.textContent='Entra na tua conta para guardar o pedido e os ficheiros. Também podes continuar pelo WhatsApp.';return}const o=orderData(),paths=await uploadBriefFiles(client,session);const saved=await client.from('orders').insert({user_id:session.user.id,service:o.service,tier:o.tier,name:o.name,contact:o.contact,idea:[o.idea,'Objetivo: '+o.goal,'Público-alvo: '+o.audience,'Utilização: '+o.use,'Formato: '+o.format,'Prazo pretendido: '+o.deadline,'Estilo: '+o.style,'Cores: '+o.colors,'Localização: '+o.location,'Referências: '+o.references,'Ficheiros no armazenamento: '+paths.join(', ')].filter(Boolean).join('\n\n'),status:'Pedido iniciado'});if(saved.error)throw saved.error;status.textContent=experimental?'Interesse registado na tua conta.':'Pedido guardado na tua conta. A equipa entrará em contacto.';orderForm.reset();document.getElementById('fileList').textContent='Ainda não selecionaste ficheiros.'}catch(e){status.textContent='Não foi possível guardar o pedido: '+(e.message||'erro inesperado')}finally{btn.disabled=false}};
</script></body></html>
