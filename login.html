<!doctype html>
<html lang="pt-AO">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar — Nzinga Creatives</title><link rel="stylesheet" href="style.css">
<style>
.auth{min-height:calc(100vh - 90px);display:grid;place-items:center;padding:32px 18px}.card{width:min(440px,100%);border:3px solid var(--black);padding:28px;background:#fff;box-shadow:10px 10px 0 var(--yellow)}.card h1{font-family:'Playfair Display',serif;font-size:3rem;margin:0 0 8px}.card h1 i{color:var(--red);font-style:normal}.sub{color:var(--muted);font-size:.85rem;margin-bottom:24px}.tabs{display:grid;grid-template-columns:1fr 1fr;margin-bottom:20px}.tab{padding:11px;border:2px solid var(--black);background:#fff;font:inherit;font-weight:700;cursor:pointer}.tab.active{background:var(--black);color:#fff}.field{margin:13px 0}.field label{display:block;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;border:2px solid var(--black);padding:12px;font:inherit}.submit{width:100%;margin-top:8px;padding:13px;border:2px solid var(--black);background:var(--red);color:#fff;font:inherit;font-weight:700;cursor:pointer}.submit:disabled{opacity:.6}.message{margin-top:14px;padding:10px;border-left:4px solid var(--yellow);font-size:.78rem;display:none}.back{display:block;margin-top:20px;color:var(--black);font-size:.75rem}
</style></head><body>
<header class="nav"><a class="logo" href="index.html">NZINGA<span>CREATIVES</span></a><nav><a href="index.html">Início</a><a class="active" href="nzingagpt.html">NzingaGPT</a></nav></header><div class="samakaka" aria-hidden="true"></div>
<main class="auth"><section class="card"><p class="eyebrow">NZINGA · CONTA</p><h1>Entra no Nzinga<i>GPT</i></h1><p class="sub">Guarda as tuas conversas e continua de onde paraste.</p><div class="tabs"><button class="tab active" data-mode="login">Entrar</button><button class="tab" data-mode="signup">Criar conta</button></div><form id="authForm"><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Palavra-passe</label><input id="password" type="password" minlength="6" autocomplete="current-password" required></div><button class="submit" id="submit" type="submit">Entrar</button></form><div class="message" id="message"></div><a class="back" href="nzingagpt.html">← Voltar ao NzingaGPT</a></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* Configure the two public Supabase values in this page before enabling production auth. */
const SUPABASE_URL=window.NZINGA_SUPABASE_URL||'';const SUPABASE_KEY=window.NZINGA_SUPABASE_KEY||'';let client=null;let mode='login';
const form=document.getElementById('authForm'),submit=document.getElementById('submit'),message=document.getElementById('message');
function show(t){message.textContent=t;message.style.display='block'}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));submit.textContent=mode==='login'?'Entrar':'Criar conta';document.getElementById('password').autocomplete=mode==='login'?'current-password':'new-password';message.style.display='none'});
form.onsubmit=async e=>{e.preventDefault();if(!SUPABASE_URL||!SUPABASE_KEY)return show('A autenticação ainda precisa ser configurada no ambiente do site.');client=client||supabase.createClient(SUPABASE_URL,SUPABASE_KEY);submit.disabled=true;try{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const result=mode==='login'?await client.auth.signInWithPassword({email,password}):await client.auth.signUp({email,password});if(result.error)throw result.error;if(mode==='signup'&&!result.data.session)show('Conta criada. Verifica o teu email para confirmar a conta.');else location.href='nzingagpt.html'}catch(err){show(err.message||'Não foi possível concluir a operação.')}finally{submit.disabled=false}};
</script></body></html>
