<!DOCTYPE html><html lang="pt-AO"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="NzingaGPT — conversa, cria e explora ideias."><title>NzingaGPT — Nzinga Creatives</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><style>.nz-chat{max-width:1000px;margin:auto;padding:40px 22px 80px;min-height:calc(100vh - 100px);display:flex;flex-direction:column}.chat-top{display:flex;justify-content:space-between;align-items:end;border-bottom:3px solid var(--black);padding:35px 0 22px;gap:20px}.chat-top h1{font-family:'Playfair Display',serif;font-size:clamp(3.4rem,7vw,6rem);line-height:.85;margin:7px 0}.chat-top h1 i{color:var(--red);font-style:normal}.status{border:2px solid var(--black);background:var(--yellow);padding:8px 12px;font-size:.7rem;font-weight:700;white-space:nowrap}.messages{max-width:760px;width:100%;margin:0 auto;padding:42px 0 25px;display:flex;flex-direction:column;gap:18px}.bubble{padding:17px 20px;line-height:1.6;max-width:82%;border:2px solid var(--black)}.assistant-bubble{align-self:flex-start;background:#fff;box-shadow:6px 6px 0 var(--yellow)}.user-bubble{align-self:flex-end;background:var(--black);color:#fff;box-shadow:6px 6px 0 var(--red)}.starters{max-width:760px;width:100%;margin:0 auto 25px;display:flex;gap:9px;flex-wrap:wrap}.starter{font:inherit;text-align:left;padding:10px 13px;border:2px solid var(--black);background:transparent;cursor:pointer}.starter:hover{background:var(--yellow);transform:translateY(-2px)}.composer{position:sticky;bottom:12px;width:100%;max-width:760px;margin:auto;background:var(--black);padding:9px;display:flex;gap:8px;box-shadow:8px 8px 0 var(--red)}.composer textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:#fff;padding:13px;font:inherit;min-height:48px}.composer button{border:2px solid var(--black);background:var(--yellow);font:inherit;font-weight:700;padding:0 18px;cursor:pointer}.composer button:hover{background:#fff}.note{text-align:center;color:var(--muted);font-size:.7rem;margin:16px 0 0}.thinking{display:inline-flex;gap:5px}.thinking i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1s infinite}.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}@keyframes pulse{50%{opacity:.2;transform:translateY(-3px)}}@media(max-width:600px){.nz-chat{padding-inline:16px}.chat-top{align-items:flex-start;flex-direction:column}.starters{gap:7px}.starter{width:100%}.bubble{max-width:94%}.composer button{padding:0 13px}}
</style></head><body><header class="nav"><a class="logo" href="index.html">NZINGA<span>CREATIVES</span></a><button class="menu" id="menuBtn" aria-label="Abrir menu" aria-expanded="false">☰</button><nav id="navLinks"><a href="index.html">Início</a><a href="servicos.html">Serviços</a><a class="active" href="nzingagpt.html">NzingaGPT</a><a href="surpresas.html">Surpresas</a><a href="market.html">Market</a><a href="raizes.html">Raízes</a></nav></header><div class="samakaka" aria-hidden="true"></div><main class="nz-chat"><header class="chat-top"><div><p class="eyebrow">NZINGAGPT · LABORATÓRIO DE IDEIAS</p><h1>Nzinga<i>GPT</i></h1></div><span class="status">● EM CONSTRUÇÃO</span></header><section class="messages" id="messages" aria-live="polite"><div class="bubble assistant-bubble">Olá. Não precisas escolher um modo. Podes simplesmente começar a falar comigo.</div></section><div class="starters" id="starters"><button class="starter">Tenho uma ideia meio confusa.</button><button class="starter">Quero aprender alguma coisa.</button><button class="starter">Preciso de ajuda com um problema.</button><button class="starter">Quero simplesmente conversar.</button></div><form class="composer" id="chatForm"><textarea id="gptPrompt" rows="1" autocomplete="off" placeholder="Escreve o que quiseres..." aria-label="Mensagem para o NzingaGPT"></textarea><button type="submit">Enviar ↑</button></form><p class="note">O NzingaGPT ainda está em construção. As respostas atuais são uma demonstração da experiência.</p></main><script src="script.js"></script><script>const messages=document.getElementById('messages'),form=document.getElementById('chatForm'),input=document.getElementById('gptPrompt'),starters=document.getElementById('starters');const replies=['Interessante. Vamos desmontar isso em partes e descobrir o caminho mais interessante.','Não precisas organizar tudo antes de escrever. Vamos começar pelo que já tens.','Podemos olhar para isso por outro ângulo. O que parece pequeno aqui pode esconder uma ideia maior.','Entendi. Vamos transformar essa conversa em algo concreto.'];function addBubble(text,type){const b=document.createElement('div');b.className='bubble '+type;b.textContent=text;messages.appendChild(b);b.scrollIntoView({behavior:'smooth',block:'end'})}function send(q){q=q.trim();if(!q)return;starters.style.display='none';addBubble(q,'user-bubble');const wait=document.createElement('div');wait.className='bubble assistant-bubble';wait.innerHTML='<span class="thinking"><i></i><i></i><i></i></span>';messages.appendChild(wait);setTimeout(()=>{wait.textContent=replies[Math.floor(Math.random()*replies.length)];wait.scrollIntoView({behavior:'smooth',block:'end'})},600)}form.addEventListener('submit',e=>{e.preventDefault();send(input.value);input.value='';input.focus()});starters.querySelectorAll('.starter').forEach(b=>b.onclick=()=>{input.value=b.textContent;send(input.value);input.value=''});</script></body></html>
