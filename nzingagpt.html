<!DOCTYPE html><html lang="pt-AO"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="NzingaGPT — conversa, cria e explora ideias."><title>NzingaGPT — Nzinga Creatives</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><style>.nz-chat{max-width:1120px;margin:auto;padding:30px 22px 70px;min-height:calc(100vh - 100px);display:flex;flex-direction:column}.chat-top{display:flex;justify-content:space-between;align-items:end;border-bottom:3px solid var(--black);padding:32px 0 20px;gap:20px}.chat-top h1{font-family:'Playfair Display',serif;font-size:clamp(3.4rem,7vw,6rem);line-height:.85;margin:7px 0}.chat-top h1 i{color:var(--red);font-style:normal}.chat-status{border:2px solid var(--black);background:var(--yellow);padding:8px 12px;font-size:.7rem;font-weight:700;white-space:nowrap}.chat-layout{display:grid;grid-template-columns:210px minmax(0,760px);gap:30px;width:100%;justify-content:center}.chat-sidebar{padding-top:38px}.side-label{font-size:.65rem;letter-spacing:.14em;color:var(--muted);font-weight:700;margin:26px 0 10px}.memory-note{font-size:.75rem;line-height:1.5;color:var(--muted);border-left:3px solid var(--yellow);padding-left:10px}.messages{width:100%;padding:42px 0 25px;display:flex;flex-direction:column;gap:20px;min-height:330px}.bubble{padding:17px 20px;line-height:1.65;border:2px solid var(--black);white-space:pre-wrap;overflow-wrap:anywhere;max-width:88%}.bubble.assistant{align-self:flex-start;background:#fff;box-shadow:6px 6px 0 var(--yellow);color:var(--ink)}.bubble.user{align-self:flex-end;background:var(--black);color:#fff;box-shadow:6px 6px 0 var(--red)}.starters{width:100%;margin:0 0 25px;display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.starter{font:inherit;text-align:left;padding:12px 14px;border:2px solid var(--black);background:transparent;cursor:pointer}.starter:hover{background:var(--yellow);transform:translateY(-2px)}.composer{position:sticky;bottom:12px;width:100%;background:var(--black);padding:9px;display:flex;gap:8px;box-shadow:8px 8px 0 var(--red);z-index:5}.composer textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:#fff;padding:13px;font:inherit;min-height:48px;max-height:180px}.composer button{border:2px solid var(--black);background:var(--yellow);font:inherit;font-weight:700;padding:0 18px;cursor:pointer}.composer button:hover{background:#fff}.composer button:disabled{opacity:.55;cursor:wait}.composer-hint{text-align:right;color:#999;font-size:.62rem;margin:7px 2px 0}.note,.status-note{text-align:center;color:var(--muted);font-size:.7rem;margin:12px 0 0}.status-note #status{font-weight:700;color:var(--ink)}@media(max-width:820px){.chat-layout{grid-template-columns:1fr}.chat-sidebar{display:none}}@media(max-width:600px){.nz-chat{padding-inline:16px}.chat-top{align-items:flex-start;flex-direction:column}.starters{grid-template-columns:1fr;gap:7px}.bubble{max-width:96%}.composer button{padding:0 13px}.composer{box-shadow:5px 5px 0 var(--red)}}</style></head><body><header class="nav"><a class="logo" href="index.html">NZINGA<span>CREATIVES</span></a><button class="menu" id="menuBtn" aria-label="Abrir menu" aria-expanded="false">☰</button><nav id="navLinks"><a href="index.html">Início</a><a href="servicos.html">Serviços</a><a class="active" href="nzingagpt.html">NzingaGPT</a><a href="surpresas.html">Surpresas</a><a href="market.html">Market</a><a href="raizes.html">Raízes</a></nav></header><div class="samakaka"></div><main class="nz-chat"><header class="chat-top"><div><p class="eyebrow">NZINGAGPT · LABORATÓRIO DE IDEIAS</p><h1>Nzinga<i>GPT</i></h1></div><span class="chat-status">INTELIGÊNCIA CRIATIVA</span></header><div class="chat-layout"><aside class="chat-sidebar"><p class="side-label">SOBRE</p><p class="memory-note">Um espaço para conversar, criar, aprender e desenvolver ideias.</p></aside><div><section class="messages" id="messages" aria-live="polite"></section><div class="starters" id="starters"><button class="starter">Tenho uma ideia meio confusa.</button><button class="starter">Quero aprender alguma coisa.</button><button class="starter">Preciso de ajuda com um problema.</button><button class="starter">Quero simplesmente conversar.</button></div><form class="composer" id="chatForm"><textarea id="gptPrompt" placeholder="Escreve o que quiseres..."></textarea><button id="sendBtn" type="submit">Enviar ↑</button></form><p class="composer-hint">Enter envia · Shift + Enter cria nova linha</p><p class="status-note"><span id="status">● ONLINE</span></p></div></div></main><script src="script.js"></script><script>const messages=document.getElementById('messages'),form=document.getElementById('chatForm'),input=document.getElementById('gptPrompt'),starters=document.getElementById('starters'),sendBtn=document.getElementById('sendBtn'),status=document.getElementById('status');const KEY='nzingaGPT.sessions.v2';let sessions=[],activeId=null,controller=null;const welcome={role:'assistant',content:'Olá. Não precisas escolher um modo. Podes simplesmente começar a falar comigo.',time:Date.now()};function normalize(){sessions=sessions.filter(s=>s&&Array.isArray(s.messages)).map(s=>({id:s.id||crypto.randomUUID(),createdAt:s.createdAt||Date.now(),updatedAt:s.updatedAt||s.createdAt||Date.now(),messages:s.messages.map(m=>({role:m.role==='assistant'?'assistant':'user',content:String(m.content||''),time:m.time||s.createdAt||Date.now()}))})).slice(0,20)}function save(){try{localStorage.setItem(KEY,JSON.stringify(sessions))}catch(e){console.warn(e)}}function current(){return sessions.find(s=>s.id===activeId)}function bubble(m){const b=document.createElement('div');b.className='bubble '+m.role;b.textContent=m.content;messages.appendChild(b);return b}function renderMessages(){const s=current();messages.innerHTML='';(s?s.messages:[welcome]).forEach(bubble);starters.style.display=s&&s.messages.some(m=>m.role==='user')?'none':'grid';messages.lastElementChild?.scrollIntoView({block:'end'})}function createSession(){const s={id:crypto.randomUUID(),createdAt:Date.now(),updatedAt:Date.now(),messages:[{...welcome,time:Date.now()}]};sessions.unshift(s);activeId=s.id;save();renderMessages()}async function send(q){q=q.trim();if(!q||sendBtn.disabled)return;let s=current();if(!s){createSession();s=current()}const sessionId=s.id;s.messages.push({role:'user',content:q,time:Date.now()});s.updatedAt=Date.now();bubble({role:'user',content:q});save();starters.style.display='none';input.value='';sendBtn.disabled=true;status.textContent='● A PENSAR';controller=new AbortController();const out=bubble({role:'assistant',content:'...'});let answer='';try{const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:s.messages.slice(-24).map(({role,content})=>({role,content}))}),signal:controller.signal});if(!response.ok){const data=await response.json().catch(()=>({}));throw new Error(data.error||'Não foi possível obter uma resposta agora.')}const reader=response.body?.getReader();if(!reader)throw new Error('O servidor não devolveu uma resposta.');const decoder=new TextDecoder();let buffer='';while(true){const {done,value}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});const lines=buffer.split('\n');buffer=lines.pop()||'';for(const line of lines){if(!line.startsWith('data:'))continue;try{const event=JSON.parse(line.slice(5).trim());if(typeof event.delta==='string'){answer+=event.delta;out.textContent=answer}}catch{}}}if(!answer)throw new Error('Não consegui formular uma resposta agora.');const live=sessions.find(x=>x.id===sessionId);if(live){live.messages.push({role:'assistant',content:answer,time:Date.now()});live.updatedAt=Date.now()}activeId=sessionId;save();renderMessages();status.textContent='● ONLINE'}catch(error){out.textContent=error.message||'Não consegui responder agora.';status.textContent='● INDISPONÍVEL'}finally{controller=null;sendBtn.disabled=false;sendBtn.textContent='Enviar ↑'}}form.addEventListener('submit',e=>{e.preventDefault();send(input.value)});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send(input.value)}});starters.querySelectorAll('.starter').forEach(b=>b.onclick=()=>send(b.textContent));try{sessions=JSON.parse(localStorage.getItem(KEY)||'[]');normalize()}catch{sessions=[]}if(!sessions.length)createSession();else{activeId=sessions.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0))[0].id;renderMessages()}</script></body></html>
