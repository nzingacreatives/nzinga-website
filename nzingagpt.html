<!DOCTYPE html><html lang="pt-AO"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="NzingaGPT — conversa, cria e explora ideias."><title>NzingaGPT — Nzinga Creatives</title><link rel="stylesheet" href="style.css"></head><body><header class="nav"><a class="logo" href="index.html">NZINGA<span>CREATIVES</span></a></header><main class="nz-chat"><header class="chat-top"><div><p class="eyebrow">NZINGAGPT · LABORATÓRIO DE IDEIAS</p><h1>NzingaGPT</h1></div><span id="status">● ONLINE</span></header><section id="messages" aria-live="polite"></section><div id="starters"><button>Tenho uma ideia meio confusa.</button><button>Quero aprender alguma coisa.</button><button>Preciso de ajuda com um problema.</button><button>Quero simplesmente conversar.</button></div><form id="chatForm"><textarea id="gptPrompt" placeholder="Escreve o que quiseres..."></textarea><button id="sendBtn" type="submit">Enviar ↑</button></form></main><script>const messages=document.getElementById('messages'),form=document.getElementById('chatForm'),input=document.getElementById('gptPrompt'),starters=document.getElementById('starters'),sendBtn=document.getElementById('sendBtn'),status=document.getElementById('status');const KEY='nzingaGPT.sessions.v2';let sessions=[],activeId=null,controller=null;const welcome={role:'assistant',content:'Olá. Não precisas escolher um modo. Podes simplesmente começar a falar comigo.',time:Date.now()};function normalize(){sessions=sessions.filter(s=>s&&Array.isArray(s.messages)).map(s=>({id:s.id||crypto.randomUUID(),createdAt:s.createdAt||Date.now(),updatedAt:s.updatedAt||s.createdAt||Date.now(),messages:s.messages.map(m=>({role:m.role==='assistant'?'assistant':'user',content:String(m.content||''),time:m.time||s.createdAt||Date.now()}))})).slice(0,20)}function save(){normalize();localStorage.setItem(KEY,JSON.stringify(sessions))}function current(){return sessions.find(s=>s.id===activeId)}function bubble(m){const b=document.createElement('div');b.className='bubble '+m.role;b.textContent=m.content;messages.appendChild(b);return b}function renderMessages(){const s=current();messages.innerHTML='';(s?s.messages:[welcome]).forEach(bubble);starters.style.display=s&&s.messages.some(m=>m.role==='user')?'none':'block';messages.lastElementChild?.scrollIntoView({block:'end'})}function createSession(){const s={id:crypto.randomUUID(),createdAt:Date.now(),updatedAt:Date.now(),messages:[{...welcome,time:Date.now()}]};sessions.unshift(s);activeId=s.id;save();renderMessages()}async function send(q){q=q.trim();if(!q||sendBtn.disabled)return;let s=current();if(!s){createSession();s=current()}const sessionId=s.id;s.messages.push({role:'user',content:q,time:Date.now()});s.updatedAt=Date.now();bubble({role:'user',content:q});save();starters.style.display='none';input.value='';sendBtn.disabled=true;status.textContent='● A PENSAR';controller=new AbortController();const out=bubble({role:'assistant',content:'...'});let answer='';try{const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:s.messages.slice(-24).map(({role,content})=>({role,content}))}),signal:controller.signal});if(!response.ok){const data=await response.json().catch(()=>({}));throw new Error(data.error||'Não foi possível obter uma resposta agora.')}const reader=response.body?.getReader();if(!reader)throw new Error('O servidor não devolveu uma resposta.');const decoder=new TextDecoder();let buffer='';while(true){const {done,value}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});const lines=buffer.split('\n');buffer=lines.pop()||'';for(const line of lines){if(!line.startsWith('data:'))continue;try{const event=JSON.parse(line.slice(5).trim());if(typeof event.delta==='string'){answer+=event.delta;out.textContent=answer}}catch{}}}if(!answer)throw new Error('Não consegui formular uma resposta agora.');const live=sessions.find(x=>x.id===sessionId);if(live){live.messages.push({role:'assistant',content:answer,time:Date.now()});live.updatedAt=Date.now()}save();renderMessages();status.textContent='● ONLINE'}catch(error){out.textContent=error.message||'Não consegui responder agora.';status.textContent='● INDISPONÍVEL'}finally{controller=null;sendBtn.disabled=false;sendBtn.textContent='Enviar ↑'}}form.addEventListener('submit',e=>{e.preventDefault();send(input.value)});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send(input.value)}});starters.querySelectorAll('button').forEach(b=>b.onclick=()=>send(b.textContent));try{sessions=JSON.parse(localStorage.getItem(KEY)||'[]');normalize()}catch{sessions=[]}if(!sessions.length)createSession();else{activeId=sessions.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0))[0].id;renderMessages()}</script></body></html>
